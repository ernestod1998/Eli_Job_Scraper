name: Collect and publish Eli jobs
on:
  workflow_dispatch:
    inputs:
      collect:
        description: Collect sources before publishing (false publishes committed data)
        type: boolean
        default: true
        required: true
      source_timeout:
        description: Maximum seconds per source (120 for rollout smoke check)
        type: number
        default: 600
        required: true
  schedule:
    - cron: '17 17 * * *'
permissions:
  contents: read
concurrency:
  group: eli-collection-pages
  cancel-in-progress: false
jobs:
  collect:
    if: github.event_name == 'workflow_dispatch' || vars.ENABLE_SCHEDULE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 95
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Verify curated employer boards
        if: github.event_name != 'workflow_dispatch' || inputs.collect
        timeout-minutes: 5
        continue-on-error: true
        run: python seed_registry.py
      - name: Collect sources sequentially
        if: github.event_name != 'workflow_dispatch' || inputs.collect
        env:
          SOURCE_TIMEOUT: ${{ inputs.source_timeout || 600 }}
        run: python collect.py --timeout "$SOURCE_TIMEOUT"
      - name: Persist observations and status
        if: github.event_name != 'workflow_dispatch' || inputs.collect
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python ci_commit_push.py --message 'Refresh Eli job listings and source status' all_jobs.json source_status.json linkedin_jobs.json indeed_jobs.json boards_jobs.json registry_jobs.json usajobs_jobs.json governmentjobs_jobs.json calopps_jobs.json calcareers_jobs.json ats_registry.json
      - name: Build only public assets
        run: python build_site.py --committed
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: collect
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy committed collection
        id: deployment
        uses: actions/deploy-pages@v4
